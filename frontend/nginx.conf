server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets (cheap CWV win).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # API → backend container. client_max_body_size matches Flask MAX_CONTENT_LENGTH
    # (64MB); long read timeout covers slow OpenAI extraction.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 64m;
    }

    # Hashed build assets are immutable → cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the prerendered HTML shells (so deploys take effect immediately).
    location = /sitemap.xml { add_header Content-Type application/xml; }
    location = /robots.txt  { add_header Content-Type text/plain; }

    # SPA + prerendered routes: serve /pricing/index.html etc., else fall back to
    # the SPA shell for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
