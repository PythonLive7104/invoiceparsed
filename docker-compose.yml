# InvoiceParsed — production compose. Everything runs on this one box.
#
#   docker compose up -d --build
#
# Services: Postgres (the app's own database), the Flask API, an nginx that
# serves the SPA + proxies /api, Redis for rate-limit state, and a nightly
# database backup. Only OpenAI and Resend are external.
#
# Config comes from backend/.env (app secrets) and the root .env (see
# .env.example: POSTGRES_PASSWORD, SITE_DOMAIN, VITE_* build args).
# Backups, restores and migrating in from a managed Postgres: see DB.md.

services:
  # The application database. Deliberately NOT published to the host: it is
  # reachable only from the other containers on this compose network, as
  # "db:5432". Data lives in the pgdata volume and outlives `up`/`down`.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceparsed}
      # Set a real one in the root .env for anything you care about. The default
      # exists so a fresh clone comes up without configuration.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoiceparsed}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceparsed}
    command:
      # Tuned for a 2 GB box; raise these if you give the VPS more RAM.
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoiceparsed} -d ${POSTGRES_DB:-invoiceparsed}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly gzipped dump into ./backups, keeping the last 7. Same-disk backups
  # don't survive disk loss — copy them off-box (DB.md).
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-invoiceparsed}
      PGUSER: ${POSTGRES_USER:-invoiceparsed}
      PGDATABASE: ${POSTGRES_DB:-invoiceparsed}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -h db | gzip > /backups/invoiceparsed-$$ts.sql.gz; then
            echo "[db-backup] wrote invoiceparsed-$$ts.sql.gz"
          else
            echo "[db-backup] FAILED at $$ts"; rm -f /backups/invoiceparsed-$$ts.sql.gz
          fi
          ls -1t /backups/invoiceparsed-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep 86400
        done

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # ephemeral; rate-limit counters only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Shared rate-limit store across gunicorn workers (overrides .env memory://).
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      # The app's database is the db service above. Set here rather than in
      # backend/.env so the container hostname can't drift from the service name
      # (and so backend/.env stays usable for host-local dev).
      # "+psycopg2" names the driver explicitly: SQLAlchemy 2.1 defaults a bare
      # "postgresql://" to psycopg v3, which isn't in requirements.txt. config.py
      # pins it too, so this is belt-and-braces — and it documents the intent.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-invoiceparsed}:${POSTGRES_PASSWORD:-invoiceparsed}@db:5432/${POSTGRES_DB:-invoiceparsed}
      # Belt and braces: a stale SUPABASE_URL in backend/.env must not pull the
      # app back to a managed database now that DATABASE_URL is authoritative.
      SUPABASE_URL: ""
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Same-origin: the SPA calls /api on this host; nginx proxies to backend.
        VITE_API_URL: ""
        # MUST be set for the "Continue with Google" button to render (Vite bakes
        # it at build time). Put it in the root .env that Compose reads.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        # Analytics — also baked at build time, so set these in the root .env
        # and REBUILD (not just restart) after changing them. Blank = no tracking.
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_PLAUSIBLE_SRC: ${VITE_PLAUSIBLE_SRC:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads:
  pgdata:
