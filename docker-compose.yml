# InvoiceParsed — production compose.
#
#   docker compose up -d --build
#
# The database (Supabase), OpenAI and Resend are external services, so only two
# containers run here: the Flask API and an nginx that serves the SPA and
# reverse-proxies /api to the API. Secrets come from backend/.env.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # ephemeral; rate-limit counters only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Shared rate-limit store across gunicorn workers (overrides .env memory://).
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Same-origin: the SPA calls /api on this host; nginx proxies to backend.
        VITE_API_URL: ""
        # MUST be set for the "Continue with Google" button to render (Vite bakes
        # it at build time). Put it in the root .env that Compose reads.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads:
