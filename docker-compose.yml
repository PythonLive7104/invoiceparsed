# InvoiceParsed — production compose.
#
#   docker compose up -d --build
#
# Self-hosted Postgres (db) replaces Supabase. The app prefers SUPABASE_URL over
# DATABASE_URL, so it stays on Supabase until you blank SUPABASE_URL in
# backend/.env (see DB.md for the migration runbook). OpenAI/Resend are external.
# Secrets come from backend/.env and the root .env (Compose vars).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceparsed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: invoiceparsed
    # Tuned for a small (2 GB) box. Not published to the host → only reachable as
    # db:5432 on the internal network (never exposed to the internet).
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceparsed -d invoiceparsed"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily pg_dump → ./backups (keeps the last 7). Copy these OFF the box too
  # (a same-disk backup won't survive disk failure) — see DB.md.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -h db -U invoiceparsed -d invoiceparsed | gzip > /backups/invoiceparsed-$$ts.sql.gz; then
            echo "[db-backup] wrote invoiceparsed-$$ts.sql.gz"
          else
            echo "[db-backup] FAILED at $$ts"; rm -f /backups/invoiceparsed-$$ts.sql.gz
          fi
          ls -1t /backups/invoiceparsed-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep 86400
        done

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # ephemeral; rate-limit counters only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Shared rate-limit store across gunicorn workers (overrides .env memory://).
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      # Local Postgres connection. Only used when SUPABASE_URL is blank in
      # backend/.env (the app prefers SUPABASE_URL). Lets you cut over safely.
      DATABASE_URL: postgresql://invoiceparsed:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}@db:5432/invoiceparsed
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Same-origin: the SPA calls /api on this host; nginx proxies to backend.
        VITE_API_URL: ""
        # MUST be set for the "Continue with Google" button to render (Vite bakes
        # it at build time). Put it in the root .env that Compose reads.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads:
  pgdata:
