name: CI

# Runs on every push and pull request. The point is that a refactor cannot
# quietly break something: the tenancy change moved the plan from the user to
# the organization and broke nine frontend call sites, which was only caught by
# grepping for them by hand. A build step would have failed immediately.

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the previous run rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No services needed: the suite runs against a temporary SQLite file and
    # stubs every external call (OpenAI, Resend, Bachs), so it needs no
    # credentials and reaches no network.
    env:
      AUTO_CREATE_TABLES: "true"
      RATELIMIT_ENABLED: "false"
      # Explicitly blank so a runner-level variable can never make the suite
      # talk to a real provider. conftest asserts this too.
      OPENAI_API_KEY: ""
      RESEND_API_KEY: ""
      BACHS_SECRET_KEY: ""
      BACHS_WEBHOOK_SECRET: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Migrations apply from empty, and match the models
        # Catches the two ways a migration goes wrong in practice: it does not
        # apply at all, or it applies but leaves the schema disagreeing with
        # models.py (someone edited a model and forgot to generate one).
        env:
          AUTO_CREATE_TABLES: "false"
          DATABASE_URL: sqlite:///ci-schema.db
        run: |
          flask --app app db upgrade
          flask --app app db migrate -m "ci drift probe" 2>&1 | tee drift.log
          if ! grep -q "No changes in schema detected" drift.log; then
            echo "::error::models.py and the migrations disagree. Run 'flask --app app db migrate' and commit the revision."
            exit 1
          fi

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps matches frontend/Dockerfile, and is currently
        # REQUIRED rather than optional: package.json pins vite ^8 while
        # @vitejs/plugin-react is 4.x, which declares support only up to vite 7.
        # A plain `npm ci` fails with ERESOLVE on the committed lockfile, so a
        # fresh clone cannot install without this flag. The build itself is
        # unaffected. The real fix is upgrading @vitejs/plugin-react to 6.x
        # (which supports vite 8) and dropping the flag here and in the
        # Dockerfile together.
        run: npm ci --legacy-peer-deps

      - name: Build
        # Runs the sitemap generation, the Vite build and the prerender pass, so
        # a broken import or a missing export fails here.
        run: npm run build
